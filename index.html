<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <title>Top navbar example · Bootstrap v5.3.3</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./css/styles.css" rel="stylesheet">

    <style>
		.logo { width: 40px; height: 40px; }
		.page { display: none; }
		.page.active { display: block; }
		.product-img { position: relative; text-align: center; }
		.price {
			position: absolute; bottom: 10px; right: 0px;
			padding: 2px 4px 2px 4px;
			border-radius: 4px 0 0 4px;
			color: white;
			background-color: green;
		}
		.card { padding: 0; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="text/javascript">

		// highlight current page on navbar and show/hide pages
		function activateLink(id) {
			$('.nav-link').removeClass('active');
			$('.page').removeClass('active');
			$(`.${id}`).addClass('active');
		}

    </script>
</head>
<body>

    <!-- top nav bar -->
    <nav class="navbar navbar-expand-md navbar-light bg-light mb-4">
        <div class="container-fluid">

            <!-- Top Left Link -->
            <a class="navbar-brand" href="#" onClick="javascript:activateLink('Home');return false;">
				<img class="logo" src="./images/logo.webp" alt="aperture logo">
            </a>

            <!-- do not delete or modify the next 3 lines (button)-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">

                    <!-- START NAV LINKS -->
                    <li class="nav-item">
                        <a class="nav-link home active" href="#" onClick="javascript:activateLink('home');return false;">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link products" href="#" onClick="javascript:activateLink('products');return false;">Products</a>
                    </li>
                    <li class="nav-item about">
                        <a class="nav-link" href="#" onClick="javascript:activateLink('about');return false;">About</a>
                    </li>
                    <li class="nav-item contact">
                        <a class="nav-link" href="#" onClick="javascript:activateLink('contact');return false;">Contact</a>
                    </li>
                    <!-- END NAV LINKS -->

                </ul>
<!--                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>-->
            </div>
        </div>
    </nav>

    <main class="container">

    <div class="page home active">
		<div class="products row">
			<div class="card col-md-4">
				<div class="product-img">
					<img src="./images/om1nm.jpg" alt="" class="card-img-top">
					<div class="price">$263.63</div>
				</div>
				<div class="card-body">
					<h5 class="card-title">Olympus OM-1N</h5>
					<p class="card-text">Leightweight 35mm SLR with built-in light-meter and sharp Zuiko lense platform.</p>
					<button class="btn btn-primary w-100">View</button>
				</div>
			</div>
		</div>
    </div>
    <div class="page products">Products</div>
    <div class="page about">About</div>
    <div class="page contact">Contact</div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
